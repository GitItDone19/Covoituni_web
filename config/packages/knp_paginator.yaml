knp_paginator:
    page_range: 5                       # Number of page links to display
    default_options:
        page_name: page                 # Name of the query parameter for pages
        sort_field_name: sort           # Name of the query parameter for sorting
        sort_direction_name: direction  # Name of the query parameter for direction
        distinct: true                  # Ensure distinct results when sorting
        filter_field_name: filterField  # Name of the query parameter for filtering
        filter_value_name: filterValue  # Name of the query parameter for filter value
    template:
        pagination: 'pagination/numbered_pagination.html.twig'
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'
        filtration: '@KnpPaginator/Pagination/filtration.html.twig' 